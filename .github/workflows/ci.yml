name: CI

# main/dev 로 push하거나, main 으로 PR 열 때 코드 검증 실행
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

# 같은 브랜치에서 연속 push 시 이전 실행은 취소(불필요한 중복 방지)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
